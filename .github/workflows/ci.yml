name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests and release build
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        run: swift test --parallel

      - name: Build release CLI
        run: swift build -c release --product astrolabe

  typescript:
    name: TypeScript and Node.js tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-adapter/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Type-check MCP adapter
        run: npm --prefix mcp-adapter run typecheck

      - name: Run Node.js and MCP adapter tests
        run: npm test

  local-install:
    name: Codex local installation
    needs:
      - swift
      - typescript
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-adapter/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Codex package in isolated paths
        run: |
          npm run install:codex -- \
            --package-dir "$RUNNER_TEMP/astrolabe-package" \
            --user-skill-dir "$RUNNER_TEMP/skills/astrolabe" \
            --client-config "codex=$RUNNER_TEMP/codex/config.toml"

      - name: Verify Codex installation
        run: |
          npm run check:codex -- \
            --package-dir "$RUNNER_TEMP/astrolabe-package" \
            --user-skill-dir "$RUNNER_TEMP/skills/astrolabe" \
            --client-config "codex=$RUNNER_TEMP/codex/config.toml"
