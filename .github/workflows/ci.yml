name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift tests and release build
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        run: swift test --parallel

      - name: Build release CLI
        run: swift build -c release --product astrolabe

  typescript:
    name: TypeScript and Node.js tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-adapter/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Type-check MCP adapter
        run: npm --prefix mcp-adapter run typecheck

      - name: Run Node.js and MCP adapter tests
        run: npm test

  local-install:
    name: Codex local installation
    needs:
      - swift
      - typescript
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-adapter/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build Homebrew Distribution
        run: |
          npm --prefix mcp-adapter run build
          swift build -c release --product astrolabe
          npm run distribution:assemble -- \
            --output "$RUNNER_TEMP/homebrew/Cellar/astrolabe/2.0.0/libexec" \
            --channel homebrew \
            --architecture "$(uname -m)"

      - name: Verify installed Homebrew lifecycle
        run: |
          brew_prefix="$RUNNER_TEMP/homebrew"
          formula_root="$brew_prefix/Cellar/astrolabe/2.0.0"
          stable_launcher="$brew_prefix/bin/astrolabe"
          test_home="$RUNNER_TEMP/home"
          config_path="$test_home/.codex/config.toml"
          skill_path="$test_home/.agents/skills/astrolabe"
          trap_path="$RUNNER_TEMP/source-command-traps"

          mkdir -p "$brew_prefix/opt" "$brew_prefix/bin" "$test_home" "$trap_path"
          ln -s "$formula_root" "$brew_prefix/opt/astrolabe"
          ln -s "$brew_prefix/opt/astrolabe/libexec/bin/astrolabe" "$stable_launcher"
          for command in git npm swift tsc; do
            printf '%s\n' '#!/bin/sh' 'echo "Unexpected source build command" >&2' 'exit 99' > "$trap_path/$command"
            chmod +x "$trap_path/$command"
          done

          HOME="$test_home" PATH="$trap_path:$PATH" "$stable_launcher" install \
            --client codex \
            --user-skill-dir "$skill_path" \
            --client-config "codex=$config_path"
          HOME="$test_home" PATH="$trap_path:$PATH" "$stable_launcher" check \
            --client codex \
            --user-skill-dir "$skill_path" \
            --client-config "codex=$config_path"
          HOME="$test_home" PATH="$trap_path:$PATH" "$stable_launcher" doctor --verbose --json > "$RUNNER_TEMP/doctor.json"
          node -e 'const report = require(process.argv[1]); if (!report.success) process.exit(1)' "$RUNNER_TEMP/doctor.json"
          grep -F "command = \"$stable_launcher\"" "$config_path"
          test "$(readlink "$skill_path")" = "$brew_prefix/opt/astrolabe/libexec/skills/astrolabe"
          HOME="$test_home" PATH="$trap_path:$PATH" "$stable_launcher" uninstall \
            --client codex \
            --user-skill-dir "$skill_path" \
            --client-config "codex=$config_path"
          test ! -e "$skill_path"
